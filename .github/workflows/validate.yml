name: validate

on:
  push:
    branches: [main]
  pull_request:

# 既定の GITHUB_TOKEN を読み取りのみに絞る（handball-project#284）。この CI は配信
# データを検証するだけで、追記も push もしない。リポジトリ設定の
# default_workflow_permissions も read だが、設定は UI から変えられるので workflow 側
# にも明示して差分に残す。
permissions:
  contents: read

# Action は完全な commit SHA でピン留めする（handball-project#284）。可変タグは
# 差し替えが効くので、タグを奪われるとランナーで任意コードが走る。追随するときは
# `git ls-remote --tags <repo>` で引き直し、**末尾コメントのバージョンも直す**こと。

# 同一ブランチで走行中のジョブは新しい push で打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # 配信 JSON を読むだけで、クロスコンパイルもリンクも要らないので Linux ランナーで足りる
    # （handball-toolkit 本体の CI は flake の都合で macOS を使うが、ここは無関係）。
    runs-on: ubuntu-latest

    steps:
      - name: 配信データを checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sample-matches

      # 検証 CLI は handball-toolkit（public）が持つ。main を追うので、コア側で
      # validators が強化されればこの CI にもそのまま効く。
      - name: 検証 CLI（handball-toolkit）を checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kinjo-ryura/handball-toolkit
          path: toolkit

      # ubuntu ランナーにプリインストールされた rustup の stable を使う。
      # `+stable` は toolkit の rust-toolchain.toml（1.97.0 + iOS / wasm / Android
      # ターゲット）を意図的に外すため — ここで要るのはホスト向け CLI のビルドだけで、
      # クロスターゲットの rust-std を毎回ダウンロードする理由がない。
      # CLI + コアの依存は serde / serde_json / chrono / uuid のみで、クリーンな
      # debug ビルドで約 10 秒。キャッシュを挟むほうが割に合わないので素で毎回ビルドする。
      - name: v2 配信データを検証
        working-directory: toolkit
        # exit code は CLI 既定に従う: 0 = error なし（warning のみも通過）/
        # 1 = error あり / 2 = 使い方・パス誤り。
        run: cargo +stable run -p handball-toolkit-cli -- validate ../sample-matches/v2

      # 出荷済み HandballRecorder 1.2.0 は possession fact を変換できず、含む試合は
      # 一覧から「無言で」脱落する（handball-project#194）。schemaVersion を上げれば
      # 明示エラーにはなるが、版チェックは index 単位の全体ゲート（SampleMatchStoreV2
      # の `guard index.schemaVersion == current` は return で一覧ごと落とす）なので、
      # 「その 1 件だけ明示エラー」にはできない。1.2.0 に届く粒度は「全部か、無言脱落か」
      # の二択。よって possession を含む試合は /v2/ に配信しない、を機械で守る。
      #
      # 検査は toolkit の検証 CLI ではなくここに置く。possession は SAMPLE_DTO_V2 として
      # 正当で、汎用 OSS の validator に禁止を焼くと他の利用者の正当なデータを弾くため。
      # この禁止は 1.2.0 が現役の間だけの時限措置で、期限が来たらこのステップごと消す。
      - name: possession fact が配信データに混入していないか検査
        run: |
          set -uo pipefail
          found=0
          for file in sample-matches/v2/matches/*.json sample-matches/v2/highlights/*.json; do
            [ -e "$file" ] || continue
            # decode 失敗を「possession なし」に落とさない（不正 JSON は前段の CLI が
            # 落とすが、ここも fail-closed にしておく）。
            if ! hit=$(jq -r 'any(.facts[]?; .payload.kind == "possession")' "$file"); then
              echo "::error file=$file::jq が JSON を読めなかったため possession 検査を実施できない"
              found=1
              continue
            fi
            if [ "$hit" = "true" ]; then
              echo "::error file=$file::possession fact を含む試合は /v2/ に配信できない（出荷済み 1.2.0 が無言で脱落する。handball-project#194）"
              found=1
            fi
          done
          exit "$found"
